sonar.projectKey=VideoclubAPPV
sonar.projectName=VideoclubAPPV
sonar.sourceEncoding=UTF-8

# Application code
sonar.sources=.
sonar.exclusions=test_app.py,coverage.xml,__pycache__/**,*.db

# Tests
sonar.tests=.
